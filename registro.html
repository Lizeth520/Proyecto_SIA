<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario | SIA</title>
</head>
<body>
     <header>
        <a href="index.html">
            <center>
            <img src="assets/images/SIA.jpeg" alt="Logo de la empresa" width="150">
            </center>
        </a>
    </header>

        <section>
            <center>
            <h3>!Bienvenidos a SIA!</h3>
            <p>
                Registrate y disfruta de 
                productos frescos para tu hogar.
            </p>
            <form action="#" method="post">
                <label for="Nombre">Nombre</label><br>
                <input type="text" id="Nombre">
                <br>
                <label for="correo">Correo de Acceso</label><br>
                <input type="email" id="correo">
                <br>
                <label for="Telefono">Telefono</label><br>
                <input type="number" id="Telefono">
                <br>
                <label for="password">Contraseña</label><br>
                <input type="password" id="password">
                <br>
                <p>Estoy de acuerdo con terminos y condiciones</p>
                <button type="submit">Crear Cuenta</button>
                </center>
            </form>
        </section>

        <section>
            <center>
            <p>Continuar con:</p>

            <button type="submit">Google</button>
            <button type="submit">Apple</button>
            </center>
        </section>
    
</body>
</html>
