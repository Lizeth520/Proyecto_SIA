<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario | SIA</title>
</head>
<body>
     <header>
        <a href="index.html">
            <img src="assets/images/SIA.jpeg" alt="Logo de la empresa" width="150">
        </a>
    </header>

        <section></section>
            <h3>!Bienvenidos a SIA!</h3>
            <p>
                Registrate y disfruta de 
                productos frescos para tu hogar.
            </p>
            <form action="#" method="post">
                <label for="Nombre">Nombre</label>
                <input type="text" id="Nombre">
                <br>
                <label for="correo">Correo Acceso</label>
                <input type="email" id="correo">
                <br>
                <label for="Telefono">Telefono</label>
                <input type="number" id="Telefono">
                <br>
                <label for="password">Contraseña</label>
                <input type="password" id="password">
                <br>
                <button type="submit">Ingresar</button>
            </form>
        </section>
    
</body>
</html>
