<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesion en el panel de la empresa">
    <title>Inicio Sesión | SIA</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="assets/images/SIA.jpeg" alt="Logo de la empresa">
        </a>
    </header>

    <!--Formulario inicio usuario-->

    <main>
        <section>
            <h3>Inicio Sesión</h3>
            <form action="#" method="post">
                <label for="login-correo">Correo</label>
                <input type="email" id="login-correo">
                <br>
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password">
                <br>
                <button type="submit">Ingresar</button>
            </form>
        </section>

        <!--Formulario de registro-->

    </main>
</body>
</html>
